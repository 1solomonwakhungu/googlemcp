# Release: on a v* tag, build the sdist and wheel with uv, attach both to a
# GitHub Release, and optionally publish to PyPI via OIDC Trusted Publishing
# (automatically when repository variable PYPI_TRUSTED_PUBLISHING is 'true',
# or manually on a tag ref via workflow_dispatch).
# The build job is read-only; release gets contents: write; pypi gets id-token: write.
# Actions are pinned to full commit SHAs; see docs/security.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version (expected v$version)"
            exit 1
          fi
      - name: uv build
        run: uv build --no-sources
      - name: Smoke test the wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          "$RUNNER_TEMP/venv/bin/googlemcp" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/googlemcp" products > /dev/null
      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in
            *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* \
            --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/googlemcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Remove checksums file before PyPI upload
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
