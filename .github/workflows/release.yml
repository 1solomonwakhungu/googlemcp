# Release: on a v* tag, build the sdist and wheel with uv and attach both to
# a GitHub Release. Nothing is published to PyPI.
# The build job is read-only; only the release job gets contents: write.
# Actions are pinned to full commit SHAs; see docs/security.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version (expected v$version)"
            exit 1
          fi
      - name: uv build
        run: uv build --no-sources
      - name: Smoke test the wheel
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          "$RUNNER_TEMP/venv/bin/googlemcp" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/googlemcp" products > /dev/null
      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in
            *-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/* \
            --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
