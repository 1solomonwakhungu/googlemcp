# Continuous integration for GoogleMCP.
# Every third-party action is pinned to a full commit SHA (tag in the trailing
# comment). Downloaded binaries are verified against pinned SHA-256 digests.
# See docs/security.md for the rationale behind each scan.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  TERRAFORM_VERSION: "1.15.7"
  TFLINT_VERSION: "v0.64.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  CHECKOV_VERSION: "3.3.21"
  TF_DIR: infra/terraform

jobs:
  python:
    name: python ${{ matrix.python-version }} (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: uv sync
        run: uv sync --locked --all-extras
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest with coverage
        run: >-
          uv run pytest
          --cov=googlemcp --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Export locked dependencies
        run: >-
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: >-
          uv run --only-group dev pip-audit --strict --disable-pip --require-hashes
          -r "$RUNNER_TEMP/requirements.txt"

  terraform:
    name: terraform (fmt, validate, test, tflint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Terraform roots and lint config
        id: detect
        run: |
          has_tf() { [ -d "$1" ] && compgen -G "$1/*.tf" > /dev/null; }
          if has_tf "$TF_DIR"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TF_DIR has no .tf files on this ref; Terraform checks skipped."
          fi
          if has_tf "$TF_DIR/bootstrap"; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$TF_DIR/.tflint.hcl" ]; then
            echo "tflint=true" >> "$GITHUB_OUTPUT"
          else
            echo "tflint=false" >> "$GITHUB_OUTPUT"
            if has_tf "$TF_DIR"; then
              echo "::warning::$TF_DIR/.tflint.hcl is missing; tflint skipped."
            fi
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.detect.outputs.present == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        if: steps.detect.outputs.present == 'true'
        run: terraform -chdir="$TF_DIR" fmt -check -recursive -diff
      - name: terraform init and validate (each root)
        if: steps.detect.outputs.present == 'true'
        env:
          HAS_BOOTSTRAP: ${{ steps.detect.outputs.bootstrap }}
        run: |
          roots=("$TF_DIR")
          if [ "$HAS_BOOTSTRAP" = "true" ]; then
            roots+=("$TF_DIR/bootstrap")
          fi
          for root in "${roots[@]}"; do
            echo "::group::$root"
            # A committed lock file must not drift in CI.
            lock_args=()
            if [ -f "$root/.terraform.lock.hcl" ]; then
              lock_args=(-lockfile=readonly)
            else
              echo "::warning::$root/.terraform.lock.hcl is not committed; provider hashes are unpinned."
            fi
            terraform -chdir="$root" init -backend=false -input=false "${lock_args[@]}"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done
      - name: terraform test
        if: steps.detect.outputs.present == 'true'
        run: terraform -chdir="$TF_DIR" test -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.detect.outputs.present == 'true' && steps.detect.outputs.tflint == 'true'
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        if: steps.detect.outputs.present == 'true' && steps.detect.outputs.tflint == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          config="$GITHUB_WORKSPACE/$TF_DIR/.tflint.hcl"
          tflint --config="$config" --init
          tflint --config="$config" --chdir="$TF_DIR" --recursive --format=compact

  iac-scan:
    name: checkov (IaC scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: checkov
        run: |
          # Fall back to the same frameworks if .checkov.yaml is ever absent.
          config_args=(--framework terraform github_actions --compact --quiet)
          if [ -f .checkov.yaml ]; then
            config_args=(--config-file .checkov.yaml)
          fi
          uvx --from "checkov==${CHECKOV_VERSION}" checkov "${config_args[@]}" --directory .

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks git
        run: >-
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml
          --redact --no-banner --exit-code 1 .

  workflow-lint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
