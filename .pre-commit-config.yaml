# Fast local checks that mirror CI (.github/workflows/ci.yml).
# Install once: uv run --with pre-commit pre-commit install
# Hook repos are pinned to commit SHAs; the tag is in the trailing comment.
# Slow or network-bound checks (pip-audit, checkov, terraform test) run in CI only.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, via uv)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-em-dash
        name: no em dashes (project writing rule)
        entry: '\xe2\x80\x94'
        language: pygrep
        types: [text]
      - id: forbid-credential-files
        name: forbid credential and state files
        entry: credential, token, or Terraform state files must never be committed
        language: fail
        files: (^|/)(client_secret[^/]*\.json|credentials[^/]*\.json|token[^/]*\.json|[^/]*\.tfstate(\.[^/]*)?|[^/]*\.tfvars)$
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -diff
        language: system
        files: \.tf$
